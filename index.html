<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:">
<title>冷蔵庫の献立</title>
<style>
  :root {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --text: #23211d;
    --muted: #6b665c;
    --border: #e2ddd2;
    --accent: #2f7d5b;
    --accent-text: #ffffff;
    --chip: #efebe2;
    --chip-on: #2f7d5b;
    --danger: #c62828;
    --danger-bg: #fdecea;
    --ok-bg: #e8f3ed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --surface: #22211e;
      --text: #ece9e2;
      --muted: #a39e93;
      --border: #3a3833;
      --accent: #4fae84;
      --accent-text: #0e1a14;
      --chip: #2e2d29;
      --chip-on: #4fae84;
      --danger: #ff6b6b;
      --danger-bg: #3a1f1f;
      --ok-bg: #1d3027;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  main { max-width: 600px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.35rem; margin: 4px 0 16px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  h3 { font-size: .85rem; color: var(--muted); font-weight: 600; margin: 12px 0 6px; }
  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--chip);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: .95rem;
    cursor: pointer;
    min-height: 40px;
  }
  .chip[aria-pressed="true"] {
    background: var(--chip-on);
    border-color: var(--chip-on);
    color: var(--accent-text);
    font-weight: 600;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label.field { display: block; font-size: .85rem; color: var(--muted); margin: 14px 0 4px; }
  input[type="date"], select {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    min-height: 44px;
  }
  input[type="date"] { flex: 1; min-width: 0; }
  button.primary {
    font: inherit;
    font-weight: 700;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    min-height: 44px;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .45; cursor: default; }
  button.primary.wide { width: 100%; margin-top: 16px; font-size: 1.05rem; }
  button.link {
    font: inherit; font-size: .85rem;
    background: none; border: none; color: var(--muted);
    text-decoration: underline; cursor: pointer; padding: 4px;
  }
  .selected-note { font-size: .85rem; color: var(--muted); margin-top: 10px; min-height: 1.5em; }
  ul.stock { list-style: none; margin: 0; padding: 0; }
  ul.stock li {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  ul.stock li.urgent { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); font-weight: 600; }
  ul.stock .name { flex: 1; }
  ul.stock .exp { font-size: .85rem; white-space: nowrap; }
  ul.stock li:not(.urgent) .exp { color: var(--muted); }
  .del {
    font: inherit; background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; width: 40px; height: 40px; cursor: pointer; font-size: 1.1rem;
  }
  .empty { color: var(--muted); font-size: .9rem; margin: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid2 select { width: 100%; }
  .card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-top: 12px;
  }
  .card h4 { margin: 0; font-size: 1.1rem; }
  .meta { font-size: .85rem; color: var(--muted); margin: 2px 0 10px; }
  .bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .label { font-size: .8rem; color: var(--muted); margin: 8px 0 4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: .85rem; padding: 3px 10px; border-radius: 999px; background: var(--ok-bg); }
  .tag.urgent { background: var(--danger-bg); color: var(--danger); font-weight: 600; }
  .tag.missing { background: var(--chip); color: var(--muted); }
  .recipe-link {
    display: inline-block; margin-top: 12px;
    color: var(--accent); font-weight: 700; text-decoration: none;
    border: 1px solid var(--accent); border-radius: 10px; padding: 8px 14px;
  }
  .notice { font-size: .9rem; color: var(--muted); margin: 12px 0 0; }
  .error { color: var(--danger); }
</style>
</head>
<body>
<main>
  <h1>冷蔵庫の献立</h1>

  <section aria-labelledby="add-h">
    <h2 id="add-h">食材を登録</h2>
    <div id="catalog"></div>
    <p class="selected-note" id="selected-note"></p>
    <label class="field" for="expiry">賞味期限（任意・選んだ食材すべてに設定）</label>
    <div class="row">
      <input type="date" id="expiry">
      <button class="primary" id="add-btn" disabled>追加</button>
    </div>
  </section>

  <section aria-labelledby="stock-h">
    <div class="row" style="justify-content: space-between;">
      <h2 id="stock-h" style="margin:0">在庫 <span id="stock-count"></span></h2>
      <button class="link" id="clear-btn" hidden>すべて削除</button>
    </div>
    <div style="margin-top:12px"><ul class="stock" id="stock-list"></ul></div>
  </section>

  <section aria-labelledby="suggest-h">
    <h2 id="suggest-h">献立を提案</h2>
    <div class="grid2">
      <div>
        <label class="field" for="time">調理時間</label>
        <select id="time">
          <option value="15">15分以内</option>
          <option value="30" selected>30分以内</option>
          <option value="60">60分以内</option>
          <option value="0">指定なし</option>
        </select>
      </div>
      <div>
        <label class="field" for="mood">気分</label>
        <select id="mood">
          <option value="">なんでも</option>
          <option>和食</option>
          <option>洋食</option>
          <option>中華</option>
          <option>エスニック</option>
        </select>
      </div>
    </div>
    <button class="primary wide" id="suggest-btn">献立を提案</button>
    <div id="results" aria-live="polite"></div>
  </section>
</main>

<script>
(() => {
  'use strict';

  // よく使う食材リスト。recipes.json の ingredients はこの表記に合わせる
  const CATALOG = {
    '野菜・きのこ': ['玉ねぎ', 'にんじん', 'じゃがいも', 'キャベツ', '白菜', '大根', 'ねぎ', 'ピーマン', 'なす', 'トマト', 'きゅうり', 'ほうれん草', 'ブロッコリー', 'もやし', 'レタス', 'かぼちゃ', 'しめじ', 'えのき', 'ごぼう', 'にら'],
    '肉': ['豚肉', '鶏もも肉', '鶏むね肉', '牛肉', 'ひき肉', 'ベーコン', 'ハム', 'ウインナー'],
    '魚介': ['鮭', 'さば', 'ぶり', 'えび', 'いか', 'ツナ缶'],
    '卵・乳製品・大豆': ['卵', '牛乳', 'チーズ', 'バター', '豆腐', '油揚げ', '納豆'],
    '主食・その他': ['ごはん', 'うどん', 'パスタ', '中華麺', 'カレールウ', 'キムチ', 'こんにゃく'],
  };
  const STORAGE_KEY = 'cookingMenu.stock';
  const URGENT_DAYS = 3;
  const RESULT_COUNT = 3;

  const $ = (id) => document.getElementById(id);
  const selected = new Set();
  let stock = loadStock();
  let recipes = null;
  let recipesError = null;

  // ---------- 保存 ----------
  function loadStock() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      return Array.isArray(data) ? data.filter((s) => s && typeof s.name === 'string') : [];
    } catch (e) {
      return [];
    }
  }
  function saveStock() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stock));
    } catch (e) {
      alert('データを保存できませんでした（プライベートブラウズ等では保存されません）');
    }
  }

  // ---------- 日付 ----------
  function today() {
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  // 期限までの日数（今日=0、過ぎたら負）。期限なしは null
  function daysLeft(expiry) {
    if (!expiry) return null;
    const [y, m, d] = expiry.split('-').map(Number);
    return Math.round((new Date(y, m - 1, d) - today()) / 86400000);
  }
  function isUrgent(days) {
    return days !== null && days <= URGENT_DAYS;
  }
  function expiryLabel(days) {
    if (days === null) return '期限なし';
    if (days < 0) return `${-days}日過ぎ`;
    if (days === 0) return '今日まで';
    if (days === 1) return '明日まで';
    return `あと${days}日`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---------- 食材登録 ----------
  function renderCatalog() {
    $('catalog').innerHTML = Object.entries(CATALOG).map(([cat, items]) => `
      <h3>${escapeHtml(cat)}</h3>
      <div class="chips">
        ${items.map((name) => `<button type="button" class="chip" data-name="${escapeHtml(name)}" aria-pressed="false">${escapeHtml(name)}</button>`).join('')}
      </div>`).join('');
  }
  function updateSelection() {
    document.querySelectorAll('#catalog .chip').forEach((b) => {
      b.setAttribute('aria-pressed', selected.has(b.dataset.name) ? 'true' : 'false');
    });
    $('selected-note').textContent = selected.size ? `選択中: ${[...selected].join('、')}` : '食材をタップして選んでください（複数可）';
    $('add-btn').disabled = selected.size === 0;
  }
  $('catalog').addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    const name = btn.dataset.name;
    if (selected.has(name)) selected.delete(name); else selected.add(name);
    updateSelection();
  });
  $('add-btn').addEventListener('click', () => {
    const expiry = $('expiry').value || null;
    for (const name of selected) {
      stock.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), name, expiry });
    }
    saveStock();
    selected.clear();
    $('expiry').value = '';
    updateSelection();
    renderStock();
  });

  // ---------- 在庫一覧 ----------
  function sortedStock() {
    return stock
      .map((s) => ({ ...s, days: daysLeft(s.expiry) }))
      .sort((a, b) => {
        // 期限なしは最後、それ以外は期限の近い順（＝3日以内が必ず上に来る）
        if (a.days === null && b.days === null) return a.name.localeCompare(b.name, 'ja');
        if (a.days === null) return 1;
        if (b.days === null) return -1;
        return a.days - b.days;
      });
  }
  function renderStock() {
    const list = sortedStock();
    $('stock-count').textContent = list.length ? `(${list.length})` : '';
    $('clear-btn').hidden = list.length === 0;
    if (!list.length) {
      $('stock-list').innerHTML = '<li class="empty" style="border:none;padding:0">まだ登録されていません</li>';
      return;
    }
    $('stock-list').innerHTML = list.map((s) => `
      <li class="${isUrgent(s.days) ? 'urgent' : ''}">
        <span class="name">${escapeHtml(s.name)}</span>
        <span class="exp">${escapeHtml(expiryLabel(s.days))}${s.expiry ? `<br>${escapeHtml(s.expiry.slice(5).replace('-', '/'))}` : ''}</span>
        <button type="button" class="del" data-id="${escapeHtml(s.id)}" aria-label="${escapeHtml(s.name)}を削除">×</button>
      </li>`).join('');
  }
  $('stock-list').addEventListener('click', (e) => {
    const btn = e.target.closest('.del');
    if (!btn) return;
    stock = stock.filter((s) => s.id !== btn.dataset.id);
    saveStock();
    renderStock();
  });
  $('clear-btn').addEventListener('click', () => {
    if (!confirm('在庫をすべて削除しますか？')) return;
    stock = [];
    saveStock();
    renderStock();
  });

  // ---------- レシピ ----------
  async function loadRecipes() {
    try {
      const res = await fetch('recipes.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error('配列ではありません');
      recipes = data.filter((r) => r && r.name && Array.isArray(r.ingredients) && r.ingredients.length);
    } catch (e) {
      recipesError = e;
    }
  }

  // 在庫の食材名 → 一番期限が近い日数（期限なしのみなら null）
  function stockIndex() {
    const idx = new Map();
    for (const s of stock) {
      const d = daysLeft(s.expiry);
      if (!idx.has(s.name)) { idx.set(s.name, d); continue; }
      const cur = idx.get(s.name);
      if (d !== null && (cur === null || d < cur)) idx.set(s.name, d);
    }
    return idx;
  }

  function scoreRecipe(r, idx) {
    const have = [];
    const missing = [];
    let bonus = 0;
    for (const name of r.ingredients) {
      if (idx.has(name)) {
        const d = idx.get(name);
        have.push({ name, days: d });
        // 期限が近い在庫を使うほど加点（今日・期限切れで最大 0.4）
        if (isUrgent(d)) bonus += Math.min(URGENT_DAYS + 1 - d, URGENT_DAYS + 1) * 0.1;
      } else {
        missing.push(name);
      }
    }
    const ratio = have.length / r.ingredients.length;
    return { recipe: r, have, missing, ratio, score: ratio + bonus };
  }

  function suggest() {
    const out = $('results');
    if (recipesError) {
      out.innerHTML = `<p class="notice error">recipes.json を読み込めませんでした（${escapeHtml(recipesError.message)}）。<br>ファイルを直接開いた場合は読み込めません。GitHub Pages かローカルサーバー経由で開いてください。</p>`;
      return;
    }
    if (!recipes) {
      out.innerHTML = '<p class="notice">レシピを読み込み中です…</p>';
      return;
    }
    if (!stock.length) {
      out.innerHTML = '<p class="notice">先に在庫を登録してください。</p>';
      return;
    }
    const maxTime = Number($('time').value);
    const mood = $('mood').value;
    const idx = stockIndex();
    const ranked = recipes
      .filter((r) => !maxTime || Number(r.time) <= maxTime)
      .filter((r) => !mood || r.type === mood)
      .map((r) => scoreRecipe(r, idx))
      .filter((x) => x.have.length > 0)
      .sort((a, b) => b.score - a.score || Number(a.recipe.time) - Number(b.recipe.time))
      .slice(0, RESULT_COUNT);

    if (!ranked.length) {
      out.innerHTML = '<p class="notice">条件に合い、在庫を使えるレシピが見つかりませんでした。調理時間や気分を変えてみてください。</p>';
      return;
    }
    out.innerHTML = ranked.map(renderCard).join('') +
      (ranked.length < RESULT_COUNT ? `<p class="notice">条件に合うレシピは${ranked.length}件でした。</p>` : '');
  }

  function renderCard(x) {
    const r = x.recipe;
    const pct = Math.round(x.ratio * 100);
    const url = typeof r.url === 'string' && /^https?:\/\//i.test(r.url) ? r.url : '';
    return `
      <article class="card">
        <h4>${escapeHtml(r.name)}</h4>
        <p class="meta">${escapeHtml(r.time)}分 ・ ${escapeHtml(r.type || '')} ・ 在庫で${pct}%揃う</p>
        <div class="bar"><span style="width:${pct}%"></span></div>
        <div class="label">使える在庫</div>
        <div class="tags">${x.have.map((h) => `<span class="tag${isUrgent(h.days) ? ' urgent' : ''}">${escapeHtml(h.name)}${isUrgent(h.days) ? `（${escapeHtml(expiryLabel(h.days))}）` : ''}</span>`).join('')}</div>
        <div class="label">足りない食材</div>
        <div class="tags">${x.missing.length ? x.missing.map((m) => `<span class="tag missing">${escapeHtml(m)}</span>`).join('') : '<span class="tag">なし（全部揃っています）</span>'}</div>
        ${url ? `<a class="recipe-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">レシピを見る ↗</a>` : ''}
      </article>`;
  }

  $('suggest-btn').addEventListener('click', suggest);

  renderCatalog();
  updateSelection();
  renderStock();
  loadRecipes();
})();
</script>
</body>
</html>
